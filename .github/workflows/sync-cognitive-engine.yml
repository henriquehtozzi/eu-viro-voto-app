name: Sincronizar Cérebro Cognitivo (Isabela Amorim)

on:
  workflow_dispatch: # Disparo manual controlado para evitar deploys que quebrem a Vercel

jobs:
  sync:
    name: Sincronizar Instruções Táticas do Upstream
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 📥 Checkout do Repositório Eu Viro Voto
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🔗 Configurar Upstream (Repositório da Isabela Amorim)
        run: |
          git remote add upstream https://github.com/iaaamorim/viravoto-whatsapp.git
          git fetch upstream main

      - name: 🔍 Extrair Diretrizes do Upstream
        id: check_diff
        run: |
          UPSTREAM_HASH=$(git rev-parse --short upstream/main)
          echo "UPSTREAM_HASH=$UPSTREAM_HASH" >> $GITHUB_ENV
          
          # Cria pasta temporária para inspecionar upstream
          git checkout upstream/main -- app/cognitive_engine.py
          # Preserva o arquivo do upstream em local seguro para revisão
          mv app/cognitive_engine.py app/cognitive_engine_upstream.py
          git checkout HEAD -- app/cognitive_engine.py
          
          echo "has_changes=true" >> $GITHUB_OUTPUT

      - name: 🚀 Registrar Versão Upstream
        if: steps.check_diff.outputs.has_changes == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add app/cognitive_engine_upstream.py
          git commit -m "chore(sync): registra versão de referência da Isabela Amorim [upstream ${UPSTREAM_HASH}]" || exit 0
          git push origin main
